# Sakina stack for Coolify. Set the public domains per service in Coolify:
#   web        -> https://sakina.toophan.net (port 3000)
#   pocketbase -> https://sakina-api.toophan.net (port 8090, admin panel at /_/)
services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PUBLIC_PB_URL: ${PUBLIC_PB_URL:-http://localhost:8090}
      PB_URL: http://pocketbase:8090
    volumes:
      # Chunks of large uploads while they are being reassembled
      - uploads_tmp:/data/uploads
    expose:
      - '3000'
    depends_on:
      - pocketbase

  pocketbase:
    build: ./pb
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
      # Worker output (HLS video streams), served at /media/...
      - media:/pb/pb_public/media
    expose:
      - '8090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      PB_URL: http://pocketbase:8090
      # A dedicated PocketBase superuser for the worker (set both in Coolify)
      PB_WORKER_EMAIL: ${PB_WORKER_EMAIL}
      PB_WORKER_PASSWORD: ${PB_WORKER_PASSWORD}
    volumes:
      - media:/media
    depends_on:
      pocketbase:
        condition: service_healthy

  # Telegram bot: imports links and files posted in the group (see bot/)
  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
      TELEGRAM_API_ROOT: http://telegram-bot-api:8081
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PB_URL: http://pocketbase:8090
      # Same service account as the worker
      PB_EMAIL: ${PB_WORKER_EMAIL}
      PB_PASSWORD: ${PB_WORKER_PASSWORD}
      YTDLP_ARGS: ${YTDLP_ARGS:-}
    volumes:
      - bot_data:/data
      - telegram_files:/var/lib/telegram-bot-api
    depends_on:
      pocketbase:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started

  # Local Telegram Bot API server: lets the bot download files up to 2 GB (20 MB otherwise)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: '1'
    volumes:
      - telegram_files:/var/lib/telegram-bot-api
    expose:
      - '8081'

volumes:
  pb_data:
  uploads_tmp:
  media:
  bot_data:
  telegram_files:
